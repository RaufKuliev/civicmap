name: Исправление данных
description: Сообщить об ошибке в округе, кандидате, ресурсе или публикации
title: "[Данные]: "
labels: [data-review]
body:
  - type: input
    id: page
    attributes:
      label: Страница каталога
      placeholder: https://…
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Что нужно исправить
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Первичный источник
      placeholder: https://…
    validations:
      required: true
  - type: input
    id: accessed
    attributes:
      label: Дата доступа
      placeholder: YYYY-MM-DD
    validations:
      required: true
