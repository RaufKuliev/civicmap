name: Validate data refresh

on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: Snapshot date (YYYY-MM-DD)
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:validate
      - run: pnpm data:coverage | tee coverage.txt
      - run: pnpm data:evidence
      - uses: actions/upload-artifact@v4
        with:
          name: data-review-${{ inputs.snapshot_date }}
          path: |
            coverage.txt
            data/reports/
          if-no-files-found: error
